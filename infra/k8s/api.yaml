apiVersion: apps/v1
kind: Deployment
metadata:
  name: datapilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: $ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/datapilot-api:latest
        ports:
        - containerPort: 8000
        env:
          - name: EXTRACTOR_URL
            value: "http://extractor-svc:8001"
          - name: TRANSFORMER_URL
            value: "http://transformer-svc:8002"
          - name: LOADER_URL
            value: "http://loader-svc:8003"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: rds-secret
                key: url
          - name: GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: groq-secret
                key: key
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
